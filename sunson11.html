<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunson Solar - Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #eef6ff 0%, #d9ebfb 100%);
            color: #12365f;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 14px 50px;
        }

        .registration-card {
            width: min(1340px, 100%);
            background: #fffef5;
            border: 1px solid #d9d5c8;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(53, 101, 145, 0.15);
            padding: 20px 58px 25px;
        }

       
        .brand-section {
            min-height: 125px;
            display: flex;
            align-items: center;
            gap: 35px;
            border-bottom: 1px solid #ddd8c9;
            padding: 5px 0 15px;
        }

        .logo-side {
            width: 25%;
            min-width: 230px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .solar-logo-image {
            width: 100%;
            max-width: 300px;
            height: 100px;
            object-fit: contain;
        }

        .description-side {
            flex: 1;
            padding-right: 20px;
        }

        .description-side h1 {
            margin: 0 0 8px;
            color: #064a91;
            font-size: 30px;
            font-weight: 800;
        }

        .description-side p {
            margin: 0;
            color: #315b82;
            font-size: 17px;
            line-height: 1.6;
        }

       

        .form-title {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 5px 14px;
            background: linear-gradient(
                90deg,
                #c9e0f5,
                #eef7ff,
                #c9e0f5
            );
            color: #f2c500;
            font-size: 31px;
            font-weight: 700;
        }

        /* FORM ROW */

        .form-row {
            min-height: 65px;
            display: grid;
            grid-template-columns: 250px 1fr;
            align-items: center;
            border-bottom: 1px solid #ddd8c9;
            column-gap: 16px;
        }


        .form-row label,
        .field-label {
            font-size: 22px;
            font-weight: 700;
            color: #123f73;
            padding-left: 10px;
        }



        .form-row input[type="text"],
        .form-row input[type="email"],
        .form-row input[type="tel"],
        .form-row input[type="password"] {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d1cb;
            border-radius: 6px;
            background: white;
            outline: none;
            padding: 0 14px;
            font-size: 19px;
            color: #173d65;
        }

        .form-row input:focus,
        select:focus {
            border-color: #4e91cf;
            box-shadow: 0 0 0 3px rgba(78, 145, 207, .13);
        }

   

        .name-fields {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

  

        .dob-fields {
            display: flex;
            gap: 12px;
        }

        .dob-fields select {
            height: 50px;
            min-width: 115px;
            padding: 0 34px 0 14px;
            border: 1px solid #d1d1cb;
            border-radius: 6px;
            background: white;
            color: #233e5c;
            font-size: 18px;
            outline: none;
        }

     

        .radio-group {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 400;
            color: #173e65;
            cursor: pointer;
        }

        .radio-label input {
            width: 22px;
            height: 22px;
            accent-color: #1669c1;
        }

        /* BOTTOM CHECKBOX AREA */

        .bottom-actions {
            min-height: 86px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 36px;
        }

        .terms,
        .captcha {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #153d65;
            cursor: pointer;
        }

       

        #signUp {
            display: block;
            width: 430px;
            max-width: 90%;
            height: 69px;
            margin: 0 auto;
            border: 2px solid #e86b00;
            border-radius: 14px;
            background: linear-gradient(#ffb000, #ff7900);
            color: white;
            font-size: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .18);
        }

        #signUp:hover {
            filter: brightness(1.05);
        }

        #signUp:active {
            transform: translateY(1px);
        }

     

        .message {
            min-height: 22px;
            margin: 10px 0 0;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
        }

        .message.success {
            color: #19703b;
        }

        .message.error {
            color: #b3261e;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .registration-card {
                padding: 15px 18px 20px;
                border-radius: 14px;
            }

            .brand-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
                padding-bottom: 20px;
            }

            .logo-side {
                width: 100%;
                min-width: 0;
                justify-content: center;
            }

            .solar-logo-image {
                max-width: 280px;
            }

            .description-side {
                padding-right: 0;
            }

            .description-side h1 {
                font-size: 25px;
            }

            .description-side p {
                font-size: 15px;
            }

            .form-title {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 13px 0;
            }

            .name-fields {
                grid-template-columns: 1fr;
            }

            .dob-fields {
                flex-wrap: wrap;
            }

            .bottom-actions {
                flex-direction: column;
                gap: 12px;
                padding: 18px 0;
            }

            .captcha {
                width: 100%;
            }

            #signUp {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="registration-card">

         
            <header class="brand-section">

                <div class="logo-side">
                    <img
                        src="Media.jpg"
                        class="solar-logo-image"
                        alt="Sunson Solar Logo"
                    >
                </div>

                <div class="description-side">
                    <h1>Sunson Solar</h1>

                    <p>
                        Welcome to Sunson Solar. Please complete the
                        registration form below to create your account
                        and access services.
                    </p>
                </div>

            </header>


        

            <div class="form-title">
                Registration Form
            </div>


            <form action="registration.php" id="registrationForm">

                <div class="form-row">

                    <label for="firstName">
                        First Name:
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        name="fname"
                    >

                </div>



                <div class="form-row">

                    <label for="middleName">
                        Middle Name:
                    </label>

                    <input
                        type="text"
                        id="middleName"
                        placeholder="Enter your middle name"
                        name="mname"
                    >

                </div>



                <div class="form-row">

                    <label for="lastName">
                        Last Name:
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        name="Lname"
                    >

                </div>



                <div class="form-row">

                    <label for="email">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        name="email"
                    >

                </div>


              

                <div class="form-row">

                    <label for="mobile">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="11"
                        placeholder="Enter phone number"
                        name="num"
                    >

                </div>


              
                <div class="form-row">

                    <label for="username">
                        Username:
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Create a username"
                        autocomplete="username"
                        name="username"
                    >

                </div>


          

                <div class="form-row">

                    <label for="password">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        name="pass"
                    >

                </div>


           

                <div class="form-row">

                    <label>
                        Date of Birth:
                    </label>

                    <div class="dob-fields">

                        <select name="day" id="day">
                            <option value="">Day</option>
                        </select>

                        <select name="" id="month">
                            <option value="">Month</option>
                        </select>

                        <select name="" id="year">
                            <option value="">Year</option>
                        </select>

                    </div>

                </div>


       

                <div class="form-row gender-row">

                    <span class="field-label">
                        Gender:
                    </span>

                    <div class="radio-group">

                        <label class="radio-label">

                            <input name="gender"
                                type="radio"
                                name="gender"
                                value="Male"
                            >

                            Male

                        </label>

                        <label class="radio-label">

                            <input name="gender"
                                type="radio"
                                name="gender"
                                value="Female"
                            >

                            Female

                        </label>

                    </div>

                </div>


        
                <div class="form-row">

                    <label for="address">
                        Address:
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                    >

                </div>



                <div class="bottom-actions">

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        <span>
                            I agree to the Terms & Conditions
                        </span>

                    </label>


                    <label class="captcha">

                        
                  
                        

                </div>


          

                <button type="submit" id="signUp">
                    Sign Up
                </button>


                <p id="message" class="message"></p>

            </form>

        </section>

    </main>


    <script>

        const form =
            document.getElementById("registrationForm");

        const daySelect =
            document.getElementById("day");

        const monthSelect =
            document.getElementById("month");

        const yearSelect =
            document.getElementById("year");

        const message =
            document.getElementById("message");


       

        for (let day = 1; day <= 31; day++) {

            const option =
                document.createElement("option");

            option.value = day;
            option.textContent = day;

            daySelect.appendChild(option);
        }


        const months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];


        months.forEach(function(month, index) {

            const option =
                document.createElement("option");

            option.value = index + 1;
            option.textContent = month;

            monthSelect.appendChild(option);

        });


        const currentYear =
            new Date().getFullYear();


        for (
            let year = currentYear;
            year >= 1940;
            year--
        ) {

            const option =
                document.createElement("option");

            option.value = year;
            option.textContent = year;

            yearSelect.appendChild(option);

        }


        const mobile =
            document.getElementById("mobile");


        mobile.addEventListener("input", function () {

            this.value =
                this.value.replace(/[^0-9]/g, "");

        });


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const firstName =
                document
                .getElementById("firstName")
                .value
                .trim();


            const middleName =
                document
                .getElementById("middleName")
                .value
                .trim();


            const lastName =
                document
                .getElementById("lastName")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const phone =
                document
                .getElementById("mobile")
                .value
                .trim();


            const username =
                document
                .getElementById("username")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const address =
                document
                .getElementById("address")
                .value
                .trim();


            const terms =
                document
                .getElementById("terms")
                .checked;


            


            const genderElement =
                document.querySelector(
                    'input[name="gender"]:checked'
                );


            if (
                firstName === "" ||
                lastName === "" ||
                email === "" ||
                phone === "" ||
                username === "" ||
                password === "" ||
                address === ""
            ) {

                message.textContent =
                    "Please complete all required fields.";

                message.className =
                    "message error";

                return;
            }



            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                message.textContent =
                    "Please enter a valid email address.";

                message.className =
                    "message error";

                return;
            }



            if (!/^[0-9]+$/.test(phone)) {

                message.textContent =
                    "Phone number must contain numbers only.";

                message.className =
                    "message error";

                return;
            }



            if (password.length < 8) {

                message.textContent =
                    "Password must be at least 8 characters.";

                message.className =
                    "message error";

                return;
            }


  

            if (
                daySelect.value === "" ||
                monthSelect.value === "" ||
                yearSelect.value === ""
            ) {

                message.textContent =
                    "Please select your date of birth.";

                message.className =
                    "message error";

                return;
            }


   

            if (!genderElement) {

                message.textContent =
                    "Please select your gender.";

                message.className =
                    "message error";

                return;
            }


            const gender =
                genderElement.value;


            /* TERMS */

            if (!terms) {

                message.textContent =
                    "Please agree to the Terms & Conditions.";

                message.className =
                    "message error";

                return;
            }




            if (!robot) {

                message.textContent =
                    "Please confirm that you're not a robot.";

                message.className =
                    "message error";

                return;
            }


      

            const registrationData = {

                firstName: firstName,

                middleName: middleName,

                lastName: lastName,

                email: email,

                phoneNumber: phone,

                username: username,

                password: password,

                dateOfBirth: {

                    day: daySelect.value,

                    month: monthSelect.value,

                    year: yearSelect.value

                },

                gender: gender,

                address: address,

                agreedToTerms: true,

                robotCheck: true

            };



            localStorage.setItem(
                "sunsonRegistration",
                JSON.stringify(registrationData)
            );


            console.log(
                "Registration Data:",
                registrationData
            );



            message.textContent =
                "Registration successful!";

            message.className =
                "message success";



            form.reset();

        });

    </script>

</body>

</html>
